<!DOCTYPE html>

  <body>
    <script>
        window.addEventListener('load', function() {
            // Download engine
            fetch('wickengine.js')
                .then(resp => resp.text())
                .then(text => {
                    // Inject engine
                    var script = document.createElement('script');
                    script.type = 'text/javascript';
                    script.text = text;
                    document.getElementsByTagName('head')[0].appendChild(script);

                    // Download project
                    fetch('project.wick')
                        .then(resp => resp.blob())
                        .then(blob => {
                            // Hide preloader
                            document.getElementById('preloader').style.display = 'none';
                            document.getElementById('preloader').remove();
                            // Run project
                            Wick.WickFile.fromWickFile(blob, project => {
                                project.inject(document.getElementById('wick-canvas-container'));
                            });
                        })
                        .catch((e) => {
                            console.error('Could not download Wick project.')
                            console.error(e);
                        });
                })
                .catch((e) => {
                    console.error('Could not download Wick project.')
                    console.error(e);
                });
        }, false);
    </script>

    <style>

        #preloader {

        /* Make Flashy slightly larger if the resolution of the screen is big enough */
        @media (min-width: 1200px) {

            }
        }
        @media (min-height: 1200px) {

        #loading-bar {

            0% {top: 48%;}
            100% {top:50%;}
        }

        @keyframes pulse {

        }
